name: Validate split manifests

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_splits.py
      - name: Smoke-test custom 3/2 split generator
        run: python examples/make_custom_split.py --output /tmp/custom_split.csv
